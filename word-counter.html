<body>

<div class="container">

<header>
    <div class="logo">✦ VTools</div>
    <a href="index.html" class="back">← Back to Home</a>
</header>

<section class="hero">
    <h1>Word Counter</h1>
    <p>Count words, characters, sentences and paragraphs instantly.</p>
</section>

<div class="editor">

<textarea id="textInput"
placeholder="Start typing or paste your text here..."></textarea>

<div class="actions">
    <button class="primary" onclick="copyText()">📋 Copy Text</button>
    <button class="secondary" onclick="downloadText()">⬇ Download</button>
    <button class="secondary" onclick="clearText()">🗑 Clear</button>
</div>

</div>

<div class="stats">

    <div class="stat">
        <h2 id="words">0</h2>
        <p>Words</p>
    </div>

    <div class="stat">
        <h2 id="characters">0</h2>
        <p>Characters</p>
    </div>

    <div class="stat">
        <h2 id="sentences">0</h2>
        <p>Sentences</p>
    </div>

    <div class="stat">
        <h2 id="paragraphs">0</h2>
        <p>Paragraphs</p>
    </div>

    <div class="stat">
        <h2 id="noSpaces">0</h2>
        <p>Without Spaces</p>
    </div>

    <div class="stat">
        <h2 id="reading">0</h2>
        <p>Reading Time (min)</p>
    </div>

</div>

<div class="info">
    <h3>📊 Text Information</h3>

    <div class="info-row">
        <span>Average Word Length</span>
        <span id="average">0</span>
    </div>

    <div class="info-row">
        <span>Lines</span>
        <span id="lines">0</span>
    </div>

</div>

<footer>
    © 2026 VTools. All Rights Reserved.
</footer>

</div>

<script>

const input = document.getElementById("textInput");

function countText() {

    const text = input.value;

    const trimmed = text.trim();

    const words = trimmed.match(
        /[\p{L}\p{N}]+(?:['’_-][\p{L}\p{N}]+)*/gu
    ) || [];

    const characters = text.length;

    const noSpaces = text.replace(/\s/g, "").length;

    const sentences = trimmed
        ? (trimmed.match(/[.!?]+(?=\s|$)/g) || []).length
        : 0;

    const paragraphs = trimmed
        ? trimmed.split(/\n\s*\n/).filter(p => p.trim()).length
        : 0;

    const lines = trimmed
        ? text.split(/\r\n|\r|\n/).length
        : 0;

    const average = words.length
        ? (noSpaces / words.length).toFixed(1)
        : 0;

    const reading = words.length
        ? Math.ceil(words.length / 200)
        : 0;

    document.getElementById("words").textContent = words.length;
    document.getElementById("characters").textContent = characters;
    document.getElementById("sentences").textContent = sentences;
    document.getElementById("paragraphs").textContent = paragraphs;
    document.getElementById("noSpaces").textContent = noSpaces;
    document.getElementById("reading").textContent = reading;
    document.getElementById("average").textContent = average;
    document.getElementById("lines").textContent = lines;

}

function clearText() {
    input.value = "";
    countText();
}

async function copyText() {

    if (!input.value) {
        alert("Please enter some text first!");
        return;
    }

    try {
        await navigator.clipboard.writeText(input.value);
        alert("Text copied successfully!");
    } catch (error) {
        input.select();
        document.execCommand("copy");
        alert("Text copied!");
    }
}

function downloadText() {

    if (!input.value) {
        alert("Please enter some text first!");
        return;
    }

    const blob = new Blob([input.value], {
        type: "text/plain;charset=utf-8"
    });

    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");

    link.href = url;
    link.download = "VTools-Word-Counter.txt";

    link.click();

    URL.revokeObjectURL(url);
}

input.addEventListener("input", countText);

countText();

</script>
