
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VTools Stopwatch & Timer</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
 background:#080d1c;color:white;
 font-family:Arial,sans-serif;padding:18px;
}
.container{max-width:500px;margin:auto}
header{text-align:center;padding:20px 0 25px}
.logo{
 width:60px;height:60px;border-radius:18px;
 background:linear-gradient(135deg,#8b5cf6,#06b6d4);
 display:flex;align-items:center;justify-content:center;
 font-size:29px;margin:0 auto 12px;
}
h1{
 font-size:28px;
 background:linear-gradient(90deg,#a78bfa,#22d3ee);
 -webkit-background-clip:text;color:transparent;
}
header p{font-size:13px;color:#94a3b8;margin-top:8px}
.tabs{
 display:grid;grid-template-columns:1fr 1fr;
 gap:10px;margin-bottom:20px;
}
.tab{
 border:1px solid #26334e;background:#111a2e;
 color:#cbd5e1;padding:14px;border-radius:12px;
 font-size:14px;font-weight:bold;cursor:pointer;
}
.tab.active{
 background:linear-gradient(135deg,#7c3aed,#0891b2);
 color:white;border:0;
}
.panel{display:none}
.panel.active{display:block}
.card{
 background:#111a2e;border:1px solid #26334e;
 border-radius:20px;padding:23px 18px;text-align:center;
}
.heading{font-size:19px;margin-bottom:8px}
.desc{font-size:12px;color:#94a3b8;margin-bottom:28px}
.clock{
 font-size:clamp(39px,12vw,57px);
 font-weight:bold;letter-spacing:2px;
 font-variant-numeric:tabular-nums;
 background:linear-gradient(90deg,#c4b5fd,#67e8f9);
 -webkit-background-clip:text;color:transparent;
 margin:25px 0;
}
.milliseconds{font-size:22px}
.buttons{
 display:flex;justify-content:center;
 flex-wrap:wrap;gap:10px;margin-top:25px;
}
.btn{
 border:0;border-radius:12px;padding:13px 20px;
 font-size:13px;font-weight:bold;cursor:pointer;
 color:white;min-width:100px;
}
.primary{background:linear-gradient(90deg,#7c3aed,#0891b2)}
.secondary{background:#26334e}
.danger{background:#7f1d35}
.btn:disabled{opacity:.4;cursor:not-allowed}
.lap-list{
 margin-top:25px;text-align:left;
 max-height:220px;overflow:auto;
}
.lap-title{
 display:flex;justify-content:space-between;
 color:#94a3b8;font-size:12px;padding:10px;
 border-bottom:1px solid #26334e;
}
.lap-row{
 display:flex;justify-content:space-between;
 padding:12px 10px;border-bottom:1px solid #26334e;
 font-size:13px;
}
.lap-row span:last-child{color:#a5b4fc}
.timer-inputs{
 display:flex;justify-content:center;gap:9px;margin:25px 0;
}
.input-group{flex:1;max-width:105px}
.input-group input{
 width:100%;background:#0b1427;
 border:1px solid #334155;border-radius:12px;
 padding:15px 5px;color:white;text-align:center;
 font-size:25px;font-weight:bold;outline:none;
}
.input-group input:focus{border-color:#8b5cf6}
.input-group label{
 display:block;color:#94a3b8;font-size:11px;margin-top:8px;
}
.timer-clock{
 font-size:clamp(43px,13vw,60px);
 font-weight:bold;font-variant-numeric:tabular-nums;
 margin:30px 0;color:#67e8f9;
}
.timer-clock.finished{color:#86efac}
.progress{
 height:7px;background:#26334e;
 border-radius:20px;overflow:hidden;margin-top:22px;
}
.progress-bar{
 height:100%;width:0%;
 background:linear-gradient(90deg,#7c3aed,#22d3ee);
 transition:width .2s linear;
}
.status{margin-top:20px;color:#a5b4fc;font-size:13px;min-height:18px}
.footer{text-align:center;color:#64748b;font-size:11px;padding:22px}
</style>
</head>

<body>
<div class="container">

<header>
 <div class="logo">⏱️</div>
 <h1>VTools Stopwatch & Timer</h1>
 <p>Track time and manage your countdown easily.</p>
</header>

<div class="tabs">
 <button class="tab active" id="stopTab">⏱ Stopwatch</button>
 <button class="tab" id="timerTab">⏳ Timer</button>
</div>

<!-- STOPWATCH -->
<section class="panel active" id="stopwatch">
 <div class="card">
  <h2 class="heading">Stopwatch</h2>
  <p class="desc">Measure your time with precision.</p>

  <div class="clock" id="stopDisplay">
   00:00:00<span class="milliseconds">.00</span>
  </div>

  <div class="buttons">
   <button class="btn primary" id="startStop">▶ Start</button>
   <button class="btn secondary" id="lapBtn" disabled>🏁 Lap</button>
   <button class="btn danger" id="resetStop">↻ Reset</button>
  </div>

  <div class="lap-list" id="lapList"></div>
 </div>
</section>

<!-- TIMER -->
<section class="panel" id="timer">
 <div class="card">
  <h2 class="heading">Countdown Timer</h2>
  <p class="desc">Set your time and start the countdown.</p>

  <div class="timer-inputs">
   <div class="input-group">
    <input type="number" id="hours" min="0" max="99" value="0">
    <label>HOURS</label>
   </div>
   <div class="input-group">
    <input type="number" id="minutes" min="0" max="59" value="5">
    <label>MINUTES</label>
   </div>
   <div class="input-group">
    <input type="number" id="seconds" min="0" max="59" value="0">
    <label>SECONDS</label>
   </div>
  </div>

  <div class="timer-clock" id="timerDisplay">00:05:00</div>

  <div class="progress">
   <div class="progress-bar" id="progressBar"></div>
  </div>

  <div class="buttons">
   <button class="btn primary" id="timerStart">▶ Start</button>
   <button class="btn secondary" id="timerPause" disabled>Ⅱ Pause</button>
   <button class="btn danger" id="timerReset">↻ Reset</button>
  </div>

  <div class="status" id="timerStatus">Ready to start</div>
 </div>
</section>

<div class="footer">© 2026 VTools • Time is valuable.</div>
</div>

<script>
/* TAB SWITCH */
const stopTab=document.getElementById('stopTab');
const timerTab=document.getElementById('timerTab');

stopTab.onclick=()=>{
 stopTab.classList.add('active');
 timerTab.classList.remove('active');
 document.getElementById('stopwatch').classList.add('active');
 document.getElementById('timer').classList.remove('active');
};

timerTab.onclick=()=>{
 timerTab.classList.add('active');
 stopTab.classList.remove('active');
 document.getElementById('timer').classList.add('active');
 document.getElementById('stopwatch').classList.remove('active');
};

/* STOPWATCH */
let watchStart=0;
let watchElapsed=0;
let watchInterval=null;
let laps=[];
let lapPrevious=0;

function formatWatch(ms){
 const total=Math.floor(ms);
 const h=Math.floor(total/3600000);
 const m=Math.floor((total%3600000)/60000);
 const s=Math.floor((total%60000)/1000);
 const cs=Math.floor((total%1000)/10);

 return String(h).padStart(2,'0')+':'+
 String(m).padStart(2,'0')+':'+
 String(s).padStart(2,'0')+
 '<span class="milliseconds">.'+
 String(cs).padStart(2,'0')+'</span>';
}

function updateWatch(){
 const now=Date.now()-watchStart+watchElapsed;
 document.getElementById('stopDisplay').innerHTML=formatWatch(now);
}

document.getElementById('startStop').onclick=()=>{
 const btn=document.getElementById('startStop');

 if(!watchInterval){
  watchStart=Date.now();
  watchInterval=setInterval(updateWatch,30);
  btn.textContent='Ⅱ Pause';
  document.getElementById('lapBtn').disabled=false;
 }else{
  watchElapsed+=Date.now()-watchStart;
  clearInterval(watchInterval);
  watchInterval=null;
  btn.textContent='▶ Resume';
 }
};

document.getElementById('lapBtn').onclick=()=>{
 if(!watchInterval)return;

 const current=Date.now()-watchStart+watchElapsed;
 const difference=current-lapPrevious;
 lapPrevious=current;
 laps.push({total:current,difference:difference});
 renderLaps();
};

function renderLaps(){
 const list=document.getElementById('lapList');
 list.innerHTML='';

 if(!laps.length)return;

 const heading=document.createElement('div');
 heading.className='lap-title';
 heading.innerHTML='<span>Lap</span><span>Lap Time</span>';
 list.appendChild(heading);

 laps.slice().reverse().forEach((lap,index)=>{
  const row=document.createElement('div');
  row.className='lap-row';

  const number=document.createElement('span');
  number.textContent='Lap '+(laps.length-index);

  const time=document.createElement('span');
  time.textContent=formatLap(lap.difference);

  row.append(number,time);
  list.appendChild(row);
 });
}

function formatLap(ms){
 const s=Math.floor(ms/1000);
 const m=Math.floor(s/60);
 const sec=s%60;
 const cs=Math.floor((ms%1000)/10);
 return String(m).padStart(2,'0')+':'+
 String(sec).padStart(2,'0')+'.'+
 String(cs).padStart(2,'0');
}

document.getElementById('resetStop').onclick=()=>{
 clearInterval(watchInterval);
 watchInterval=null;
 watchStart=0;
 watchElapsed=0;
 lapPrevious=0;
 laps=[];
 document.getElementById('stopDisplay').innerHTML=
 '00:00:00<span class="milliseconds">.00</span>';
 document.getElementById('startStop').textContent='▶ Start';
 document.getElementById('lapBtn').disabled=true;
 document.getElementById('lapList').innerHTML='';
};

/* TIMER */
let timerInterval=null;
let remaining=0;
let totalDuration=0;
let endTime=0;
let timerRunning=false;

const hoursInput=document.getElementById('hours');
const minutesInput=document.getElementById('minutes');
const secondsInput=document.getElementById('seconds');

function getInputSeconds(){
 const h=Number(hoursInput.value);
 const m=Number(minutesInput.value);
 const s=Number(secondsInput.value);

 if(!Number.isInteger(h)||!Number.isInteger(m)||!Number.isInteger(s)||
 h<0||h>99||m<0||m>59||s<0||s>59){
  throw new Error('Please enter valid time values.');
 }
 return h*3600+m*60+s;
}

function formatTimer(sec){
 const h=Math.floor(sec/3600);
 const m=Math.floor((sec%3600)/60);
 const s=sec%60;

 return String(h).padStart(2,'0')+':'+
 String(m).padStart(2,'0')+':'+
 String(s).padStart(2,'0');
}

function updateTimerDisplay(){
 document.getElementById('timerDisplay').textContent=formatTimer(remaining);

 let progress=0;
 if(totalDuration>0){
  progress=((totalDuration-remaining)/totalDuration)*100;
 }
 document.getElementById('progressBar').style.width=
 Math.min(100,Math.max(0,progress))+'%';
}

function setTimerButtons(running){
 document.getElementById('timerStart').disabled=running;
 document.getElementById('timerPause').disabled=!running;
}

function startTimer(){
 if(timerRunning)return;

 if(remaining<=0){
  try{
   remaining=getInputSeconds();
  }catch(err){
   document.getElementById('timerStatus').textContent=err.message;
   return;
  }

  if(remaining<=0){
   document.getElementById('timerStatus').textContent='Please set a time greater than zero.';
   return;
  }

  totalDuration=remaining;
 }

 timerRunning=true;
 endTime=Date.now()+remaining*1000;
 setTimerButtons(true);
 document.getElementById('timerStatus').textContent='Timer is running...';

 clearInterval(timerInterval);
 timerInterval=setInterval(()=>{
  remaining=Math.max(0,Math.ceil((endTime-Date.now())/1000));
  updateTimerDisplay();

  if(remaining<=0){
   finishTimer();
  }
 },200);
}

function pauseTimer(){
 if(!timerRunning)return;

 remaining=Math.max(0,Math.ceil((endTime-Date.now())/1000));
 clearInterval(timerInterval);
 timerInterval=null;
 timerRunning=false;
 setTimerButtons(false);
 updateTimerDisplay();
 document.getElementById('timerStatus').textContent='Timer paused';
}

function resetTimer(){
 clearInterval(timerInterval);
 timerInterval=null;
 timerRunning=false;
 remaining=0;
 totalDuration=0;

 setTimerButtons(false);
 document.getElementById('timerDisplay').classList.remove('finished');
 document.getElementById('timerStatus').textContent='Ready to start';
 document.getElementById('progressBar').style.width='0%';

 try{
  document.getElementById('timerDisplay').textContent=formatTimer(getInputSeconds());
 }catch(e){
  document.getElementById('timerDisplay').textContent='00:00:00';
 }
}

function finishTimer(){
 clearInterval(timerInterval);
 timerInterval=null;
 timerRunning=false;
 remaining=0;
 updateTimerDisplay();
 setTimerButtons(false);

 document.getElementById('timerDisplay').classList.add('finished');
 document.getElementById('timerStatus').textContent='🎉 Time is up!';

 if(navigator.vibrate){
  navigator.vibrate([300,150,300,150,500]);
 }

 playAlarm();
}

/* DIGITAL ALARM SOUND */
function playAlarm(){
 try{
  const AudioContext=window.AudioContext||window.webkitAudioContext;
  if(!AudioContext)return;

  const ctx=new AudioContext();

  const melody=[
   [880,0,0.25],
   [1175,0.35,0.25],
   [880,0.70,0.25],
   [1175,1.05,0.25],
   [880,1.40,0.25],
   [1175,1.75,0.50]
  ];

  melody.forEach(([freq,delay,duration])=>{
   const osc=ctx.createOscillator();
   const gain=ctx.createGain();

   osc.type='square';
   osc.frequency.value=freq;
   osc.connect(gain);
   gain.connect(ctx.destination);

   const start=ctx.currentTime+delay;
   gain.gain.setValueAtTime(0.001,start);
   gain.gain.linearRampToValueAtTime(0.16,start+0.02);
   gain.gain.setValueAtTime(0.16,start+duration-0.04);
   gain.gain.linearRampToValueAtTime(0.001,start+duration);

   osc.start(start);
   osc.stop(start+duration);
  });

  setTimeout(()=>ctx.close(),3000);
 }catch(e){}
}

document.getElementById('timerStart').onclick=startTimer;
document.getElementById('timerPause').onclick=pauseTimer;
document.getElementById('timerReset').onclick=resetTimer;

[hoursInput,minutesInput,secondsInput].forEach(input=>{
 input.addEventListener('input',()=>{
  if(!timerRunning && remaining===0){
   try{
    document.getElementById('timerDisplay').textContent=formatTimer(getInputSeconds());
    document.getElementById('timerStatus').textContent='Ready to start';
   }catch(e){
    document.getElementById('timerStatus').textContent=e.message;
   }
  }
 });
});

updateTimerDisplay();
resetTimer();
</script>
</body>
</html>
